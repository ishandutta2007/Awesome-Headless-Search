<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#311042;#1e1b4b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#0f766e;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-gradient)" />

  <!-- Animated Pulse Rings -->
  <circle cx="200" cy="150" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="60;120;60" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.05;0.4" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="1000" cy="150" r="100" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.25">
    <animate attributeName="r" values="80;140;80" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Search Node Connectivity Graphic -->
  <g opacity="0.4">
    <line x1="150" y1="80" x2="250" y2="140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="250" y1="140" x2="180" y2="220" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="1050" y1="90" x2="950" y2="160" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite" />
    </line>
    <circle cx="150" cy="80" r="6" fill="#38bdf8" />
    <circle cx="250" cy="140" r="9" fill="#818cf8" />
    <circle cx="180" cy="220" r="7" fill="#c084fc" />
    <circle cx="1050" cy="90" r="8" fill="#38bdf8" />
    <circle cx="950" cy="160" r="10" fill="#c084fc" />
  </g>

  <!-- Animated Magnifying Glass Icon -->
  <g transform="translate(180, 105)">
    <circle cx="45" cy="45" r="30" fill="none" stroke="url(#text-gradient)" stroke-width="7" filter="url(#glow)" />
    <line x1="68" y1="68" x2="100" y2="100" stroke="url(#text-gradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
    <!-- Scanning Beam inside lens -->
    <line x1="25" y1="45" x2="65" y2="45" stroke="#38bdf8" stroke-width="3" opacity="0.7">
      <animate transform="rotate(360 45 45)" attributeName="transform" type="rotate" from="0 45 45" to="360 45 45" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Typography -->
  <text x="600" y="130" text-anchor="middle" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="url(#text-gradient)" filter="url(#glow)" letter-spacing="1">
    Awesome Headless Search
  </text>
  
  <text x="600" y="180" text-anchor="middle" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#94a3b8" letter-spacing="3">
    CURATED API-FIRST, VECTOR &amp; OPEN-SOURCE SEARCH ENGINES
  </text>

  <!-- Floating Tech Pills -->
  <g font-family="System-UI, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
    <!-- Pill 1 -->
    <rect x="360" y="215" width="120" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="420" y="236" text-anchor="middle">⚡ Sub-50ms DX</text>
    
    <!-- Pill 2 -->
    <rect x="500" y="215" width="180" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
    <text x="590" y="236" text-anchor="middle">🔍 Hybrid &amp; Vector Search</text>
    
    <!-- Pill 3 -->
    <rect x="700" y="215" width="140" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" opacity="0.9" />
    <text x="770" y="236" text-anchor="middle">🌐 API-First Architecture</text>
  </g>
</svg>
